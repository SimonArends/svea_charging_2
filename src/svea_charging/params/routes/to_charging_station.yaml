/**:
  ros__parameters:
    #For the experiment 2 other routes are used. They go from points A (-1.2,0) or B (1.2,0) to the charger at the origin. 
    # The trajectories are the shortest route that can be taken such that the svea stays within the area of the experiment and follows the 'roads' used by the experiment, but still are somewhat long. 
    
    map_waypoints_a_to_charge: "[[-1.2, 0], [-1.2, 0.5], [-1.2, 1], [-1.1239, 1.3827], [-0.9071, 1.7071], [-0.5827, 1.9239], [-0.2, 2], [0, 2], [0.445, 1.9499], [0.8678, 1.8019], [1.247, 1.5637], [1.5637, 1.247], [1.8019, 0.8678], [1.9499, 0.445], [2, 0], [2, -0.35], [2, -0.7], [1.9239, -1.0827], [1.7071, -1.4071], [1.3827, -1.6239], [1, -1.7], [0.5, -1.7], [0, -1.7], [-0.5, -1.7], [-1, -1.7], [-1.3827, -1.6239], [-1.7071, -1.4071], [-1.9239, -1.0827], [-2, -0.7], [-2, -0.2], [-2, 0.3], [-2, 0.8], [-2, 1.3], [-1.901, 1.7339], [-1.6235, 2.0818], [-1.2225, 2.2749], [-0.7775, 2.2749], [-0.3765, 2.0818], [-0.099, 1.7339], [0, 1.3], [0, 0.8667], [0, 0.4333], [0, 0]]"
    map_waypoints_b_to_charge: "[[1.2, 0], [1.2, -0.35], [1.2, -0.7], [1.1239, -1.0827], [0.9071, -1.4071], [0.5827, -1.6239], [0.2, -1.7], [-0.2, -1.7], [-0.6, -1.7], [-1, -1.7], [-1.3827, -1.6239], [-1.7071, -1.4071], [-1.9239, -1.0827], [-2, -0.7], [-2, -0.2], [-2, 0.3], [-2, 0.8], [-2, 1.3], [-1.901, 1.7339], [-1.6235, 2.0818], [-1.2225, 2.2749], [-0.7775, 2.2749], [-0.3765, 2.0818], [-0.099, 1.7339], [0, 1.3], [0, 0.8667], [0, 0.4333], [0, 0]]"


    target_velocity: 0.28
    turn_velocity: 0.12
    goal_tolerance: 0.02

    # The first waypoint and first route segment define the required start.
    start_tolerance: 1.0
    start_heading_tolerance: 3.50

    # Stop if the vehicle center is farther than this from the spline.
    corridor_width: 10.50

    # Slow down when upcoming spline curvature reaches this value [1/m].
    turn_curvature_threshold: 0.50

    # Reject a generated route containing a tighter bend than this radius [m].
    minimum_turning_radius: 0.40

    odometry_timeout_s: 0.30
    gps_timeout_s: 2.50
    rtk_timeout_s: 2.50
    require_rtk_fixed: false
    rtk_fixed_settle_s: 10.0
    max_horizontal_accuracy: 0.50
    localization_settle_s: 10.0
    max_settle_position_spread: 0.20

    # Outdoor EKF is GPS/encoder-only, so use RTK position deltas as heading
    # for Stanley instead of trusting odometry yaw.
    use_course_heading: false
    course_heading_min_distance: 0.50
    course_heading_alpha: 0.20
