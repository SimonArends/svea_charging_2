/**:
  ros__parameters:
    # These are the routes that the SVEAs follow for the experiment. map_waypoints goes
    # from point A (-1.2, 0) to point B (1.2, 0) it does not go there with the shortest 
    # route, rather it makes one lap to artificially increase the distance. In the future,
    # more laps may be included to further increase travel distance/time.
    # map_waypoints_b_to_a goes back fom B to A in a similar way. A and B are always 
    # entered in the same direction to make sure the SVEA's drive clockwise.
    #
    #map_waypoints: "[[-5, -2], [-4.5266, -2.0052], [-4.0652, -1.8989], [-3.6417, -1.6872], [-3.2799, -1.3818], [-3, -1], [-2.7201, -0.6182], [-2.3583, -0.3128], [-1.9348, -0.1011], [-1.4734, 0.0052], [-1, 0], [-0.5, 0], [0, 0]]"
    #map_waypoints: "[[-1.2, 0], [-1.2, 0.5], [-1.2, 1], [-1.1239, 1.3827], [-0.9071, 1.7071], [-0.5827, 1.9239], [-0.2, 2], [0.2, 2], [0.6, 2], [1, 2], [1.3827, 1.9239], [1.7071, 1.7071], [1.9239, 1.3827], [2, 1], [2, 0.5], [2, 0], [2, -0.5], [2, -1], [1.9239, -1.3827], [1.7071, -1.7071], [1.3827, -1.9239], [1, -2], [0.5, -2], [0, -2], [-0.5, -2], [-1, -2], [-1.3827, -1.9239], [-1.7071, -1.7071], [-1.9239, -1.3827], [-2, -1], [-2, -0.5], [-2, 0], [-2, 0.5], [-2, 1], [-1.9239, 1.3827], [-1.7071, 1.7071], [-1.3827, 1.9239], [-1, 2], [-0.6, 2], [-0.2, 2], [0.2, 2], [0.5827, 1.9239], [0.9071, 1.7071], [1.1239, 1.3827], [1.2, 1], [1.2, 0.5], [1.2, 0]]"
    map_waypoints: "[[-1.2, 0], [-1.2, 0.5], [-1.2, 1], [-1.1239, 1.3827], [-0.9071, 1.7071], [-0.5827, 1.9239], [-0.2, 2], [0, 2], [0.445, 1.9499], [0.8678, 1.8019], [1.247, 1.5637], [1.5637, 1.247], [1.8019, 0.8678], [1.9499, 0.445], [2, 0], [2, -0.35], [2, -0.7], [1.9239, -1.0827], [1.7071, -1.4071], [1.3827, -1.6239], [1, -1.7], [0.5, -1.7], [0, -1.7], [-0.5, -1.7], [-1, -1.7], [-1.3827, -1.6239], [-1.7071, -1.4071], [-1.9239, -1.0827], [-2, -0.7], [-2, -0.275], [-2, 0.15], [-2, 0.575], [-2, 1], [-1.9239, 1.3827], [-1.7071, 1.7071], [-1.3827, 1.9239], [-1, 2], [-0.6, 2], [-0.2, 2], [0.2, 2], [0.5827, 1.9239], [0.9071, 1.7071], [1.1239, 1.3827], [1.2, 1], [1.2, 0.5], [1.2, 0]]"
    map_waypoints_b_to_a: "[[1.2, 0], [1.2, -0.35], [1.2, -0.7], [1.1239, -1.0827], [0.9071, -1.4071], [0.5827, -1.6239], [0.2, -1.7], [-0.2, -1.7], [-0.6, -1.7], [-1, -1.7], [-1.3827, -1.6239], [-1.7071, -1.4071], [-1.9239, -1.0827], [-2, -0.7], [-2, -0.275], [-2, 0.15], [-2, 0.575], [-2, 1], [-1.9239, 1.3827], [-1.7071, 1.7071], [-1.3827, 1.9239], [-1, 2], [-0.5, 2], [0, 2], [0.445, 1.9499], [0.8678, 1.8019], [1.247, 1.5637], [1.5637, 1.247], [1.8019, 0.8678], [1.9499, 0.445], [2, 0], [2, -0.35], [2, -0.7], [1.9239, -1.0827], [1.7071, -1.4071], [1.3827, -1.6239], [1, -1.7], [0.6, -1.7], [0.2, -1.7], [-0.2, -1.7], [-0.5827, -1.6239], [-0.9071, -1.4071], [-1.1239, -1.0827], [-1.2, -0.7], [-1.2, -0.35], [-1.2, 0]]"





    target_velocity: 0.28
    turn_velocity: 0.12
    goal_tolerance: 0.75

    # The first waypoint and first route segment define the required start.
    start_tolerance: 1.50
    start_heading_tolerance: 3.50

    # Stop if the vehicle center is farther than this from the spline.
    corridor_width: 10.50

    # Slow down when upcoming spline curvature reaches this value [1/m].
    turn_curvature_threshold: 0.50

    # Reject a generated route containing a tighter bend than this radius [m].
    minimum_turning_radius: 0.40

    odometry_timeout_s: 0.30
    gps_timeout_s: 2.50
    rtk_timeout_s: 2.50
    require_rtk_fixed: false
    rtk_fixed_settle_s: 10.0
    max_horizontal_accuracy: 0.50
    localization_settle_s: 10.0
    max_settle_position_spread: 0.20

    # Outdoor EKF is GPS/encoder-only, so use RTK position deltas as heading
    # for Stanley instead of trusting odometry yaw.
    use_course_heading: false
    course_heading_min_distance: 0.50
    course_heading_alpha: 0.20
