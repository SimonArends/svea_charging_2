/**:
  ros__parameters:
    # Fixed [x, y] coordinates from /self/odometry/global, in metres.
    # Alternate destination route, built the exact same way as
    # to_charging_station.yaml but with a NEW physical station location
    # (same overall approach: right turn off the shared start straight,
    # then dead straight into the station).
    #
    # Straight leg 1 is the FIRST 24 WAYPOINTS OF to_parking_lot.yaml,
    # reused verbatim (identical coordinates, not regenerated) — same
    # shared start heading (~-20.8 deg) out to [21.9682, -8.3324].
    #
    # From there: a circular fillet arc, R=5.0m (tangent length ≈5.15m,
    # arc length ≈8.00m) — same target radius as to_charging_station.yaml
    # (R=5.0m was the only radius tried there that stayed under
    # turn_curvature_threshold, avoiding an unwanted turn_velocity
    # slowdown; kept as the starting point here too). Confirmed: peak
    # curvature 0.296 (1/m), well under turn_curvature_threshold=0.50
    # below. NOT yet driven - re-test before trusting.
    #
    # Anchor points (all single-shot /self/odometry/global reads, car
    # stationary, RTK fixed):
    #   - turn vertex: [26.6081, -11.8024] (std ~0.13/0.12m) - projected
    #     onto the shared leg's own heading to decide how far along to
    #     place the turn, same technique as to_charging_station.yaml.
    #   - lead-in: [24.2597, -19.6056] (std ~0.22/0.28m), a few meters
    #     behind the new station.
    #   - station: [22.8647, -22.9698] (std ~0.26/0.36m - a re-take; the
    #     first station read had covariance in the tens of thousands,
    #     i.e. taken before the EKF had converged - discarded entirely,
    #     not used).
    #
    # Unlike to_charging_station.yaml, turn_vertex->lead_in and
    # lead_in->station are NOT collinear this time - bearings differ by
    # ~5.8 deg (turn_vertex->lead_in ≈ -106.7 deg, lead_in->station ≈
    # -112.5 deg). The outgoing/exit heading used for the fillet arc is
    # lead_in->station (the final, most safety-critical approach segment
    # into the marker), same priority as before - the arc simply ends up
    # slightly re-angled to hit that heading rather than perfectly
    # matching the turn_vertex->lead_in direction. lead_in->station itself
    # is still built as a single perfectly straight rectified line (1m
    # spacing) between just those two anchor points, same as always - no
    # raw/wobbly recording used for it.
    #
    # Peak spline curvature checked at 0.296 (1/m), i.e. effective min
    # radius ~3.381m, clear of minimum_turning_radius below.
    map_waypoints: "[[0.4685, -0.1614], [1.4033, -0.5167], [2.338, -0.8719], [3.2728, -1.2272], [4.2076, -1.5824], [5.1423, -1.9377], [6.0771, -2.293], [7.0119, -2.6482], [7.9466, -3.0035], [8.8814, -3.3587], [9.8162, -3.714], [10.7509, -4.0693], [11.6857, -4.4245], [12.6205, -4.7798], [13.5552, -5.135], [14.49, -5.4903], [15.4248, -5.8456], [16.3595, -6.2008], [17.2943, -6.5561], [18.2291, -6.9113], [19.1638, -7.2666], [20.0986, -7.6219], [21.0334, -7.9771], [21.9682, -8.3324], [22.3592, -8.481], [22.8171, -8.6818], [23.2527, -8.9273], [23.6615, -9.2151], [24.0396, -9.5422], [24.3832, -9.9055], [24.6887, -10.3014], [24.9531, -10.7257], [25.1739, -11.1743], [25.3488, -11.6428], [25.4759, -12.1263], [25.5542, -12.6202], [25.5827, -13.1193], [25.5613, -13.6189], [25.49, -14.1138], [25.3697, -14.5991], [25.2015, -15.07], [24.9094, -16.0575], [24.6173, -17.0449], [24.3252, -18.0324], [24.0331, -19.0199], [23.741, -20.0074], [23.4489, -20.9948], [23.1568, -21.9823], [22.8647, -22.9698]]"

    target_velocity: 0.20
    turn_velocity: 0.12
    goal_tolerance: 0.75

    # The first waypoint and first route segment define the required start.
    start_tolerance: 1.50
    start_heading_tolerance: 0.50

    # Stop if the vehicle center is farther than this from the spline.
    corridor_width: 1.50

    # Slow down when upcoming spline curvature reaches this value [1/m].
    turn_curvature_threshold: 0.50

    # Reject a generated route containing a tighter bend than this radius [m].
    minimum_turning_radius: 0.40

    odometry_timeout_s: 0.30
    gps_timeout_s: 2.50
    rtk_timeout_s: 2.50
    require_rtk_fixed: true
    rtk_fixed_settle_s: 10.0
    max_horizontal_accuracy: 0.50
    localization_settle_s: 10.0
    max_settle_position_spread: 0.20

    # Outdoor EKF is GPS/encoder-only, so use RTK position deltas as heading
    # for Stanley instead of trusting odometry yaw.
    use_course_heading: true
    course_heading_min_distance: 0.50
    course_heading_alpha: 0.20
