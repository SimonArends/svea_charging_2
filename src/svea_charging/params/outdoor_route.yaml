/**:
  ros__parameters:
    # Fixed [x, y] coordinates from /self/odometry/global, in metres.
    # Recorded outdoor route. The missing samples on the long straight between
    # [28.9708, -11.3943] and [53.7019, -20.4277] are linearly interpolated.
    map_waypoints: "[[0.08, 0.06], [3.4054, -1.6743], [6.8375, -2.9042], [9.8627, -4.1149], [13.1001, -5.2870], [17.0590, -6.6582], [20.7134, -8.0179], [24.7937, -9.9003], [28.9708, -11.3943], [32.5038, -12.6848], [36.0368, -13.9753], [39.5698, -15.2658], [43.1029, -16.5563], [46.6359, -17.8468], [50.1689, -19.1373], [53.7019, -20.4277], [55.6704, -21.9590], [55.3155, -24.7540], [54.3397, -27.2455], [52.1761, -32.3509], [50.4993, -37.1857], [52.3462, -39.2204], [54.0947, -38.6791], [55.8307, -35.7568], [56.8935, -33.1084]]"

    target_velocity: 0.20
    turn_velocity: 0.12
    goal_tolerance: 0.75

    # The first waypoint and first route segment define the required start.
    start_tolerance: 1.50
    start_heading_tolerance: 0.50

    # Stop if the vehicle center is farther than this from the spline.
    corridor_width: 1.50

    # Slow down when upcoming spline curvature reaches this value [1/m].
    turn_curvature_threshold: 0.50

    # Reject a generated route containing a tighter bend than this radius [m].
    minimum_turning_radius: 0.40

    odometry_timeout_s: 0.30
    gps_timeout_s: 2.50
    rtk_timeout_s: 2.50
    require_rtk_fixed: true
    rtk_fixed_settle_s: 10.0
    max_horizontal_accuracy: 0.50
    localization_settle_s: 10.0
    max_settle_position_spread: 0.20
